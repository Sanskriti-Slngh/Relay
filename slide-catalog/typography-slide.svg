<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <style>
      @font-face { font-family: Inter; src: url('../web/assets/Inter-Latin.woff2'); }
      text { font-family: Inter, Arial, sans-serif; fill: #202522; }
      .muted { fill: #59665E; }
      .small { font-size: 22px; }
      .caption { font-size: 18px; }
      .light { fill: #FFFFFF; }
    </style>
    <clipPath id="momaClip"><rect x="1130" y="174" width="300" height="450" rx="6"/></clipPath>
    <clipPath id="kinfolkClip"><rect x="1452" y="174" width="388" height="450" rx="6"/></clipPath>
    <clipPath id="linearClip"><rect x="1130" y="708" width="710" height="214" rx="6"/></clipPath>
  </defs>
  <rect width="1920" height="1080" fill="#FAFAF8"/>
  <text x="80" y="88" font-size="22" font-weight="600" fill="#285D4B">RELAY VISUAL STUDY · 01</text>
  <text x="80" y="158" font-size="54" font-weight="600">Typography</text>
  <text x="80" y="202" font-size="24" class="muted">One typeface. Hierarchy comes from scale, weight, spacing, and a quiet reading measure.</text>

  <line x1="80" y1="250" x2="1048" y2="250" stroke="#E5E8E3" stroke-width="2"/>
  <text x="80" y="300" class="caption muted" font-weight="600">PAGE</text>
  <text x="80" y="370" font-size="52" font-weight="560">Playbooks</text>
  <text x="80" y="408" class="small muted">Inter 52 / 1.08 · restrained weight for primary orientation</text>

  <line x1="80" y1="460" x2="1048" y2="460" stroke="#E5E8E3"/>
  <text x="80" y="510" class="caption muted" font-weight="600">DOCUMENT</text>
  <text x="80" y="574" font-size="40" font-weight="540">Book Rehearsal Space</text>
  <text x="80" y="612" class="small muted">Inter 40 / 1.15 · Playbook title anchors the reading view</text>

  <line x1="80" y1="664" x2="1048" y2="664" stroke="#E5E8E3"/>
  <text x="80" y="714" class="caption muted" font-weight="600">INSTRUCTION</text>
  <text x="80" y="772" font-size="30" font-weight="400">2</text>
  <text x="134" y="772" font-size="30" font-weight="400">Confirm the room booking with the events office.</text>
  <text x="134" y="816" class="small muted">Readable body copy; numbering forms a narrow scan column.</text>

  <line x1="80" y1="868" x2="1048" y2="868" stroke="#E5E8E3"/>
  <text x="80" y="918" class="caption muted" font-weight="600">SUPPORTING</text>
  <text x="80" y="962" class="small">Why this matters</text>
  <text x="310" y="962" class="small muted">4 steps · Updated 18 minutes ago</text>

  <text x="1130" y="130" class="caption muted" font-weight="600">INSPIRATION → APPLICATION</text>
  <image x="1130" y="174" width="300" height="450" preserveAspectRatio="xMidYMid slice" xlink:href="sources/moma-norm.jpg" clip-path="url(#momaClip)"/>
  <image x="1452" y="174" width="388" height="450" preserveAspectRatio="xMidYMid slice" xlink:href="sources/kinfolk.jpg" clip-path="url(#kinfolkClip)"/>
  <rect x="1130" y="174" width="300" height="450" rx="6" fill="none" stroke="#E5E8E3"/>
  <rect x="1452" y="174" width="388" height="450" rx="6" fill="none" stroke="#E5E8E3"/>
  <text x="1130" y="658" class="caption">Grid discipline</text>
  <text x="1452" y="658" class="caption">Editorial pacing</text>
  <text x="1130" y="684" class="caption muted">MoMA / Müller-Brockmann</text>
  <text x="1452" y="684" class="caption muted">Kinfolk</text>

  <image x="1130" y="708" width="710" height="214" preserveAspectRatio="xMidYMid slice" xlink:href="sources/notion.jpg" clip-path="url(#linearClip)"/>
  <rect x="1130" y="708" width="710" height="214" rx="6" fill="none" stroke="#E5E8E3"/>
  <rect x="1130" y="860" width="710" height="62" fill="#202522" opacity="0.88"/>
  <text x="1154" y="899" font-size="20" class="light">Notion: document-first editing keeps typography close to the content.</text>

  <line x1="80" y1="1012" x2="1840" y2="1012" stroke="#E5E8E3"/>
  <text x="80" y="1046" class="caption muted">Applied in Relay: Inter throughout; left-aligned document hierarchy; 16px minimum body copy; secondary controls remain visually quiet.</text>
  <text x="1840" y="1046" class="caption muted" text-anchor="end">Sources: moma.org · kinfolk.com · notion.com/help</text>
